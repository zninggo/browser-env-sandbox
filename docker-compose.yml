version: "3.8"

services:
  bes-server:
    build: .
    container_name: bes-server
    ports:
      - "127.0.0.1:19821:8080"  # 仅监听回环，由反向代理暴露外网
    environment:
      - BES_POOL_SIZE=4
      - BES_AUTH_TOKEN=${BES_AUTH_TOKEN:?请在 .env 文件设置 BES_AUTH_TOKEN}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3