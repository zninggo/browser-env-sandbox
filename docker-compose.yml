version: "3.8"

services:
  bes-server:
    build: .
    container_name: bes-server
    ports:
      - "19821:19821"   # JSON-RPC API
      - "9223:9223"     # CDP debug
    environment:
      - BES_LOG_LEVEL=info
      - BES_POOL_SIZE=8
    volumes:
      - ./snapshots:/app/snapshots           # Fingerprint snapshots
      - ./recordings:/app/recordings         # Network recordings for replay
      - bes-data:/app/data                   # Persistent data (profiles, cookies)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bes", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  bes-data:
    driver: local
