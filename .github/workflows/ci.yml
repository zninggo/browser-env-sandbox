name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GOPRIVATE: github.com/zninggo/v8go
  GOSUMDB: off
  GONOSUMCHECK: github.com/zninggo/v8go
  CGO_LDFLAGS_ALLOW: "-fuse-ld=.*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: |
          CGO_ENABLED=1 go build -o bes ./cmd/bes
          CGO_ENABLED=1 go build -o bes-server ./cmd/bes-server
          CGO_ENABLED=1 go build -o bes-selftest ./cmd/bes-selftest
          CGO_ENABLED=1 go build -o bes-bench ./cmd/bes-bench

      - name: Self-test (155 browser environment checks)
        run: ./bes-selftest

      - name: Performance benchmark (compare against baseline)
        run: ./bes-bench --compare perf-baseline.json
        continue-on-error: true
